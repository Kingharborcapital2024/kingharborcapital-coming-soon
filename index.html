<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>King Harbor Capital</title>
  <meta name="description" content="King Harbor Capital — site under construction.">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="favicon-180.png">
  <style>
    :root {
      --navy: #1a2f3d;
      --navy-deep: #142030;
      --gold: #C0A272;
      --gold-lt: #d4b98a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: Georgia, 'Times New Roman', serif;
      color: #fff;
      background: var(--navy-deep);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }
    .wrap {
      width: 100%;
      max-width: 560px;
      text-align: center;
    }
    .logo {
      width: min(320px, 80vw);
      height: auto;
      margin: 0 auto 36px;
      display: block;
    }
    .eyebrow {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 16px;
    }
    h1 {
      font-size: clamp(28px, 5vw, 40px);
      font-weight: 400;
      line-height: 1.25;
      margin-bottom: 12px;
    }
    .tag {
      font-size: clamp(16px, 3vw, 20px);
      color: rgba(192, 162, 114, 0.85);
      font-style: italic;
      margin-bottom: 28px;
    }
    .rule {
      width: 48px;
      height: 1px;
      background: rgba(192, 162, 114, 0.45);
      margin: 0 auto 28px;
    }
    p {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 15px;
      line-height: 1.7;
      color: rgba(255, 255, 255, 0.55);
      margin-bottom: 28px;
    }
    a.email {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: inline-block;
      color: var(--gold);
      text-decoration: none;
      border: 0.5px solid var(--gold);
      border-radius: 4px;
      padding: 12px 22px;
      font-size: 14px;
      letter-spacing: 0.02em;
    }
    a.email:hover { background: var(--gold); color: var(--navy); }
    footer {
      margin-top: 48px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 11px;
      letter-spacing: 0.08em;
      color: rgba(255, 255, 255, 0.28);
    }
  </style>
</head>
<body>
  <main class="wrap">
    <img class="logo" src="logo-horizontal-gold-transparent.png" alt="King Harbor Capital">
    <div class="eyebrow">Coming soon</div>
    <h1>King Harbor Capital</h1>
    <div class="tag">We're under construction</div>
    <div class="rule" aria-hidden="true"></div>
    <p>Our site is being prepared. Please check back soon, or reach us at the address below.</p>
    <a class="email" href="mailto:info@kingharborcapital.com">info@kingharborcapital.com</a>
<footer>© King Harbor Capital</footer>
  </main>
</body>
</html>
